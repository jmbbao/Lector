<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Lector Swaruu-ArtariEl-Semjase</title>

  <link rel="stylesheet" href="lector_cfg/estilos_comun.css">
  <link rel="stylesheet" href="lector_cfg/estilos_movil.css">

  <!-- Manifest de la versión móvil -->
  <link rel="manifest" href="manifest_movil.json">

  <!-- Registro del service worker de la versión móvil -->
  <script src="sw_movil.js"></script>
  <!-- Este otro método le pregunta si quiere instalarlo cada vez y es molesto
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw_movil.js');
    }
  </script>  -->

<!-- Página web: 
  https://jmbbao.github.io/Lector/program/lector.html 
-->
</head>

<body data_dispositivo="movil">

<!-- BARRA SUPERIOR -->
  <div id="id_barra_superior">
    <div id="id_bloque_archivos">
	    <span id="id_archivo" data-txt="traduce_id_archivo">😳️️ SIN ARCHIVOS</span>
      <select id="id_barra_lista" data-title="traduce_id_barra_lista_title"></select>
    </div>
    <div id="id_bloque_botones"> 
      <div id="id_bloque_bot1">
        <button id="id_archivos_anterior" data-title="traduce_id_archivos_anterior_title">◀</button>
        <button id="id_archivos_siguiente" data-title="traduce_id_archivos_siguiente_title">▶</button>
      </div>
      <div id="id_bloque_bot2">
        <button id="id_btn_bajar_archivos" class="btn_color_amarillo oculto" data-txt="traduce_id_btn_bajar_archivos">⬇️ BAJAR TEXTOS</button>
        <button id="id_btn_nuevas_versiones" class="btn_color_amarillo oculto" data-txt="traduce_id_btn_nuevas_versiones">⚠️ NUEVO!</button>
        <button id="id_btn_barra_buscar" data-title="traduce_id_btn_barra_buscar_title">🔍️</button>
        <button id="id_btn_barra_ajustes" data-title="traduce_id_btn_barra_ajustes_title">⚙️</button>
        <button id="id_btn_barra_fotos" data-title="traduce_id_btn_barra_fotos_title">📷️</button>
      </div>
    </div>
  </div>
  
<!-- PANELES -->
  <div id="id_paneles_container">
    <!-- PANEL NUEVAS VERSIONES -->
    <div id="id_panel_nuevas_versiones" class="panel oculto">
      <div class="panel_titulo">
        <span data-txt="traduce_nv_titulo">NUEVAS VERSIONES DE LOS TEXTOS</span>
        <button class="panel_cerrar" data_panel="id_panel_nuevas_versiones">❌️</button>
      </div>
      <div class="panel_contenido">
        <div style="padding-right: 10px" data-txt="traduce_nv_contenido">Hay disponible nuevas versiones de los textos. Pulsa el botón para actualizarlos.</div>
        <div>
          <button id="id_btn_bajar_nuevas_versiones" class="btn_color_amarillo" style="margin-top: 10px" data-txt="traduce_nv_id_btn_bajar_nuevas_versiones">😎️ ACTUALIZAR TEXTOS</button>
        </div>
      </div>
    </div>
  
    <!-- PANEL DE BÚSQUEDA -->
    <div id="id_panel_buscar" class="panel oculto">
      <div class="panel_titulo">
        <span data-txt="traduce_busc_titulo">BUSCAR EN LOS ARCHIVOS DE TEXTO</span>
        <button class="panel_cerrar" data_panel="id_panel_buscar">❌️</button>
      </div>
  
      <div class="panel_contenido">
        <div class="panel_fila">
      <div class="bloque_input">
            <label for="id_buscar_este_texto" data-txt="traduce_busc_id_buscar_este_texto">Buscar:</label>
            <button id="id_btn_borrar" data-title="traduce_busc_id_btn_borrar_title">🗑️</button>
            <input type="text" id="id_buscar_este_texto" selected>
          </div>
        </div>
             
        <div class="panel_fila">
          <div class="bloque_opciones">
            <label id="id_label_chk_todos" data-title="traduce_busc_id_label_chk_todos_title">
              <input type="checkbox" id="id_chk_todos" checked>
              <span data-txt="traduce_busc_id_chk_todos_movil">En todos</span>
            </label>
            <label id="id_label_chk_mayusculas" data-title="traduce_busc_id_label_chk_mayusculas_title">
              <input type="checkbox" id="id_chk_mayusculas">
              <span data-txt="traduce_busc_id_chk_mayusculas_movil">May./Minúsc.</span>
            </label>
            <button id="id_btn_buscar_unico" data-txt="traduce_busc_id_btn_buscar_unico" data-title="traduce_busc_id_btn_buscar_unico_title">Buscar</button>
          </div>
        </div>
  
        <div id="id_fila_coincidencias" class="oculto">
          <div class="panel_fila">
            <span style="margin-right: 5px;" data-txt="traduce_busc_encontrados_movil">En:</span>
            <select id="id_buscar_lista" data-title="traduce_busc_id_buscar_lista_title"></select>
            <span id="id_coincidencias" data-txt="traduce_busc_id_coincidencias">encontré: 0</span>
          </div>
          <div class="bloque_coincidencias">
            <label for="id_numero_coincidencia" data-txt="traduce_busc_id_numero_coincidencia_movil">Ver núm:</label>
            <input type="number" id="id_numero_coincidencia" min="1" data-title="traduce_busc_id_numero_coincidencia_title">
            <button id="id_btn_ir_coincidencia" data-title="traduce_busc_id_btn_ir_coincidencia_title" style="margin-right: 20px;" data-txt="traduce_busc_id_btn_ir_coincidencia">Ver</button>
            <button id="id_btn_anterior_coincidencia" data-title="traduce_busc_id_btn_anterior_coincidencia_title">◀</button>
            <span id="id_coincidencia_actual"> 0 </span>
            <button id="id_btn_siguiente_coincidencia" data-title="traduce_busc_id_btn_siguiente_coincidencia_title">▶</button>
          </div>
        </div>
      </div>
    </div>
  
    <!-- PANEL DE AJUSTES -->
    <div id="id_panel_ajustes" class="panel oculto">
      <div class="panel_titulo">
        <span id="id_panel_ajustes_titulo" data-txt="traduce_ajus_titulo">AJUSTES</span>
        <button class="panel_cerrar" data_panel="id_panel_ajustes">❌️</button>
      </div>
      <div class="panel_contenido">
        <div class="panel_fila">
          <span style="margin-right: 10px;" data-txt="traduce_ajus_idioma">Idioma:</span>
          <button id="id_btn_idioma">🇪🇦️️</button>
        </div>
        
        <div class="panel_fila">
          <span style="margin-right: 10px;" data-txt="traduce_ajus_interface">Tamaño Interface:</span>
          <button id="id_interface_menos">🔽️</button>
          <span id="id_tamano_interface"></span>
          <button id="id_interface_mas">🔼️</button>   
        </div>
        
        <div class="panel_fila">
          <label for="id_tipo_letra" data-txt="traduce_ajus_id_tipo_letra_movil">Letra:</label>
          <select id="id_tipo_letra">
            <option value="arial">Arial</option>
            <option value="calibri" selected>Calibri</option>   
            <option value="courier">Courier New</option>
            <option value="georgia">Georgia</option>   
            <option value="roboto">Roboto</option>
            <option value="times">Times New Roman</option>   
            <option value="ubuntu">Ubuntu</option>
            <option value="verdana">Verdana</option>   
          </select>
          <span style="margin-right: 10px;";></span>
          <button id="id_texto_menos">🔽️</button>
          <span id="id_tamano_font"></span>
          <button id="id_texto_mas">🔼️</button>       
        </div>
        
        <div class="panel_fila">
          <label for="id_tema_select" data-txt="traduce_ajus_tema">Tema:</label>
          <select id="id_tema_select">
            <option value="claro" data-txt="traduce_ajus_id_tema_select1">Claro</option>
            <option value="oscuro" data-txt="traduce_ajus_id_tema_select2" selected>Oscuro</option>
            <option value="usuario" data-txt="traduce_ajus_id_tema_select3">Usuario</option>
          </select>
          <label for="id_color_texto" data-txt="traduce_ajus_id_color_texto">Texto:</label>
          <input type="color" id="id_color_texto">        
          <label for="id_color_fondo" data-txt="traduce_ajus_id_color_fondo">Fondo:</label>
          <input type="color" id="id_color_fondo">
        </div>
  
        <div class="panel_fila" style="margin-top: 10px;">
          <button id="id_btn_borrar_cache" data-title="traduce_ajus_id_btn_borrar_cache_title" data-txt="traduce_ajus_id_btn_borrar_cache">Borrar los Archivos de Texto</button>
          <button id="id_btn_restablecer_ajustes" data-title="traduce_ajus_id_btn_restablecer_ajustes_title" data-txt="traduce_ajus_id_btn_restablecer_ajustes">📝️ Ajustes de fábrica</button>
        </div>
      </div>
    </div>
  </div>
  
<!-- Barra de estado -->
  <div id="id_panel_estado">
    <div id="id_estado">Iniciando</div>
    <button id="id_btn_estado_paneles" data-title="traduce_estado_btn_paneles_title">⤴️</button>
  </div>
  
<!-- SCROLLAREA -->
    <div id="id_contenido"></div>
  
  <!-- SCRIPTS Mantener este orden pues en lector.js se llama a funciones de ajustes.js -->
  <script src="lector_cfg/idiomas.js"></script>
  <script src="lector_cfg/ajustes.js"></script>
  <script src="lector_cfg/buscador.js"></script>  
  <script src="lector_cfg/lector.js"></script>
</body>
</html>
